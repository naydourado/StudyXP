# ambiente local completo: docker compose up --build
#   api:     http://localhost:8000/docs
#   adminer: http://localhost:8080 (servidor: mysql, usuario: studyxp, senha: studyxp)
# as chaves SECRET_KEY e HUMOR_ENC_KEY vem do backend/.env
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: studyxp
      MYSQL_USER: studyxp
      MYSQL_PASSWORD: studyxp
      MYSQL_ROOT_PASSWORD: studyxp-root
    ports:
      - "3306:3306"
    volumes:
      - mysql_dados:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ustudyxp", "-pstudyxp"]
      interval: 5s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: mysql+pymysql://studyxp:studyxp@mysql:3306/studyxp
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  adminer:
    image: adminer
    ports:
      - "8080:8080"

volumes:
  mysql_dados:
