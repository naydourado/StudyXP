name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: studyxp
          POSTGRES_USER: studyxp
          POSTGRES_PASSWORD: studyxp
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U studyxp -d studyxp"
          --health-interval=5s --health-retries=20
    env:
      SECRET_KEY: chave-do-ci-com-mais-de-trinta-e-dois-caracteres
      # chave fernet fixa so para o ci (nao e usada em nenhum ambiente real)
      HUMOR_ENC_KEY: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-c=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt pip-audit
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Testes
        run: pytest --cov=app --cov-report=term --cov-fail-under=80
      - name: Migracoes no PostgreSQL 18
        env:
          DATABASE_URL: postgresql+psycopg://studyxp:studyxp@127.0.0.1:5432/studyxp
        run: alembic upgrade head && alembic check && alembic downgrade base
      - name: Auditoria de dependencias
        run: pip-audit -r requirements.txt

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Textos legais iguais em site, app e docs
        run: node ../scripts/sincronizar-legal.mjs --verificar
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Testes ponta a ponta e acessibilidade
        run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: relatorio-playwright
          path: frontend/playwright-report
          retention-days: 7
